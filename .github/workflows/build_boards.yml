name: Build ESP32 Firmware

on:
  pull_request:
    branches:
      - main
      - v1.28-release
    paths-ignore:
      - "docs/**"
      - "manage/**"
      - "assets/**"
      - "examples/**"
      - "README.md"
      - "ci/*unix*.sh"
      - ".github/workflows/build_unix.yml"

  push:
    branches:
      - main
      - v1.28-release
    paths-ignore:
      - "docs/**"
      - "manage/**"
      - "assets/**"
      - "README.md"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-firmware:
    name: Build ${{ matrix.board_type }} firmware
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v5.5.1

    strategy:
      fail-fast: false
      matrix:
        board_type:
#          - MICROLITE
#          - MICROLITE_C3
#          - MICROLITE_C3_USB
#          - MICROLITE_S2_SPIRAM
#          - MICROLITE_S3
#          - MICROLITE_S3_SPIRAM
          - MICROLITE_S3_SPIRAM_OCTAL
#          - MICROLITE_SPIRAM
#          - MICROLITE_SPIRAM_16M
#          - MICROLITE_SPIRAM_CAM

    env:
      IDF_PATH: /opt/esp/idf
      IDF_TOOLS_PATH: /opt/esp
      IDF_PYTHON_ENV_PATH: /opt/esp/python_env/idf5.5_py3.12_env

      IDF_CCACHE_ENABLE: "1"
      IDF_PYTHON_CHECK_CONSTRAINTS: "no"

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Mark workspace safe for git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Initialise ESP-IDF environment
        run: |
          source "$IDF_PATH/export.sh"

          idf.py --version

      - name: Clean mpy-cross
        run: |
          source "$IDF_PATH/export.sh"

          make -C mpy-cross clean || true

      - name: Build mpy-cross
        run: |
          source "$IDF_PATH/export.sh"

          make -C mpy-cross -j$(nproc)

      - name: Build firmware
        run: |
          source "$IDF_PATH/export.sh"

          chmod +x ./scripts/build_and_check.sh

          ./scripts/build_and_check.sh "${{ matrix.board_type }}"

      - name: Determine artifact version
        id: artifact
        run: |
          VERSION=$(git describe --tags --always 2>/dev/null | tr '/' '-' || echo "dev")

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "filename=microlite-${{ matrix.board_type }}-${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare firmware artifacts
        run: |
          BUILD_DIR=./boards/${{ matrix.board_type }}/build
          OUTPUT_DIR=./firmware-artifacts

          mkdir -p "${OUTPUT_DIR}"

          cp "${BUILD_DIR}/bootloader/bootloader.bin" \
             "${OUTPUT_DIR}/bootloader.bin"

          cp "${BUILD_DIR}/partition_table/partition-table.bin" \
             "${OUTPUT_DIR}/partition-table.bin"

          cp "${BUILD_DIR}/micropython.bin" \
             "${OUTPUT_DIR}/micropython.bin"

          cp "${BUILD_DIR}/micropython.elf" \
             "${OUTPUT_DIR}/micropython.elf"

      - name: Inspect firmware image
        run: |
          source "$IDF_PATH/export.sh"

          python -m esptool image_info \
            "./firmware-artifacts/micropython.bin" \
            || true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: |
            ./firmware-artifacts/bootloader.bin
            ./firmware-artifacts/partition-table.bin
            ./firmware-artifacts/micropython.bin
            ./firmware-artifacts/micropython.elf